# Paper A (JACT) pipeline configuration
primary_match_id: 1996435
fps: 10.0

sampling:
  uniform_150:
    n_frames: 150
    description: >
      Operational rule for all headline tables: from each match's complete
      22-player frames, take every (N // 150)th frame. On the primary match
      N = 43531 so the stride is 290 frames (~29 s at 10 Hz). This is not an
      independence claim; it is a fixed-cardinality design across matches.
  acf_supplement:
    decimate: 10
    max_lag_s: 60
    description: >
      1 Hz series on the primary match only, to show residual autocorrelation
      of topological summaries. Not the operational sampling rule.
  cutoff_sweep:
    description: >
      Cardinality inversion on every complete 22-player frame of the ten
      Table S1 matches. Grid 0.25–40.0 m at 0.25 m. See CUTOFF_PROTOCOL.md.
    delta_min: 0.25
    delta_max: 40.0
    delta_step: 0.25
  temporal_2min:
    window_size_min: 2.0
    description: "Grant-only temporal windows; not used for headline H1 tables"

validated_cutoffs:
  individual: 2.75
  tactical: 11.75
  team: 23.0

multi_match:
  skillcorner_only: true
  frames_per_match: 150
  sampling: uniform_complete

bootstrap:
  n_boot: 1000
  seed: 42

figures:
  # Same sample frame at both levels. Compact four-cycles (high
  # circularity) among frames that carry H1 at both cutoffs. Not the
  # persistence argmax: frame 141 is a sliver (circularity 0.10).
  individual_frame_idx: 95
  tactical_frame_idx: 95
